<script>
function applyFilters() {
  const date = document.getElementById('dateFilter').value;
  const role = document.getElementById('roleFilter').value;
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const confirmedOnly = document.getElementById('confirmedOnly').checked;
  let visible = 0;
  document.querySelectorAll('.game-card').forEach(function (card) {
    let show = true;
    if (date !== 'all' && card.dataset.date !== date) show = false;
    if (confirmedOnly && card.dataset.confirmed !== 'true') show = false;
    if (search && card.dataset.search.indexOf(search) === -1) show = false;
    card.style.display = show ? '' : 'none';
    if (show) visible++;
    card.querySelectorAll('.pitcher-block').forEach(function (el) {
      el.style.display = (role === 'pitchers' || role === 'all') ? '' : 'none';
    });
    card.querySelectorAll('.batter-block').forEach(function (el) {
      el.style.display = (role === 'batters' || role === 'all') ? '' : 'none';
    });
  });
  document.querySelectorAll('[data-date-group]').forEach(function (group) {
    let anyVisible = false;
    group.querySelectorAll('.game-card').forEach(function (c) { if (c.style.display !== 'none') anyVisible = true; });
    group.style.display = anyVisible ? '' : 'none';
  });
  document.getElementById('resultCount').textContent = visible + ' game' + (visible === 1 ? '' : 's') + ' shown';
}
function toggleDetail(id) {
  const row = document.getElementById(id);
  // '' (not a hardcoded 'table-row') so the CSS cascade decides the shown
  // display value -- a mobile media query turns this same row into a
  // stacked block instead of a table-row, and a hardcoded value here would
  // silently win over that rule (inline styles beat stylesheet rules).
  // Checking ONLY '=== none' (not the old "|| falsy" fallback) matters: an
  // empty string is falsy too, so that fallback made every row un-closable
  // after the first click open -- both branches of the old OR were true
  // forever once display became ''.
  if (row) row.style.display = (row.style.display === 'none') ? '' : 'none';
}

// Lets someone type in the REAL line their sportsbook is showing (this
// site never pulls real odds/lines -- see the prop-avg caption) and see
// the hit-rate/bar-chart recompute against that exact number instead of
// this site's own generated line. Pure client-side, off data already on
// the page (each bar's own data-value) -- no server round-trip needed.
function updatePropLine(input) {
  const newLine = parseFloat(input.value);
  if (isNaN(newLine)) return;
  const cat = input.closest('.prop-cat');
  if (!cat) return;
  const bars = cat.querySelectorAll('.prop-bar');
  const values = Array.from(bars).map(function (b) { return parseFloat(b.dataset.value); });
  const maxV = Math.max(newLine, ...values) || 1;
  let overCount = 0;
  bars.forEach(function (bar, i) {
    const v = values[i];
    const isOver = v > newLine;
    if (isOver) overCount++;
    bar.classList.toggle('prop-bar-over', isOver);
    bar.classList.toggle('prop-bar-under', !isOver);
    bar.style.height = Math.max(v / maxV * 100, 4) + '%';
  });
  const barsEl = cat.querySelector('.prop-bars');
  if (barsEl) {
    const baselinePct = Math.min(Math.max(newLine / maxV * 100, 0), 100);
    barsEl.style.setProperty('--baseline', baselinePct.toFixed(0) + '%');
  }
  const rateEl = cat.querySelector('.prop-rate');
  if (rateEl) {
    const n = bars.length;
    const pct = n ? Math.round(overCount / n * 100) : 0;
    rateEl.textContent = pct + '% over ' + newLine + ' (last ' + n + ')';
  }
}

function resetPropLine(button) {
  const wrap = button.closest('.prop-line-input');
  const input = wrap && wrap.querySelector('input');
  if (!input) return;
  input.value = input.dataset.modelLine;
  updatePropLine(input);
}

// Favorites are pure client-side (localStorage, per-browser) -- this is
// the anonymous public dashboard, not the signed-in My Bets page, so
// there's no account to sync them against. A player_id is enough to
// persist: everything else (name, whether they're playing today) is
// read fresh off whatever the SAME page already rendered for them,
// rather than caching a second, potentially-stale copy of their info.
const FAVORITES_KEY = 'mlbPropsFavorites';
// Favorites are explicitly a same-day-only scratchpad, not a persistent
// watchlist -- a player_id favorited today would otherwise silently keep
// showing as favorited tomorrow too (anyone who plays daily), and a team-
// pick favorite (keyed by that game's own game_pk) would just accumulate
// forever as "missing" entries once each game's date passes. Stamped
// alongside the favorites themselves; checked on every read, so the first
// read after midnight (the next click, page load, etc. -- there's no
// interval ticking this over mid-session) wipes yesterday's list instead
// of carrying it into a new day.
const FAVORITES_DATE_KEY = 'mlbPropsFavoritesDate';

function todayLocalDateString() {
  return new Date().toDateString();
}

function loadFavorites() {
  try {
    if (localStorage.getItem(FAVORITES_DATE_KEY) !== todayLocalDateString()) {
      localStorage.removeItem(FAVORITES_KEY);
      return [];
    }
    const raw = localStorage.getItem(FAVORITES_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveFavorites(ids) {
  try {
    localStorage.setItem(FAVORITES_KEY, JSON.stringify(ids));
    localStorage.setItem(FAVORITES_DATE_KEY, todayLocalDateString());
  } catch (e) { /* private-browsing/quota -- favorites just won't persist past this session */ }
}

function syncFavoriteButtons() {
  const keys = loadFavorites();
  document.querySelectorAll('.favorite-toggle').forEach(function (btn) {
    const key = btn.dataset.favoriteKey;
    const active = keys.indexOf(key) !== -1;
    btn.classList.toggle('active', active);
    btn.innerHTML = active ? '&#9829;' : '&#9825;';
  });
  const countEl = document.getElementById('favorites-count');
  if (countEl) countEl.textContent = keys.length;
}

// A game-pk badge next to each game's own matchup title, so "how many of
// my favorites are in THIS game" doesn't require opening the favorites
// panel and cross-referencing team names by eye. Player rows/pitcher rows/
// moneyline-run line-total spans all live inside their own game's
// .game-card, so closest('.game-card') resolves those; a pick card (Top
// Overs/Unders) sits outside every .game-card's DOM subtree, so it carries
// its own data-game-pk directly instead.
function updateFavoriteCounts() {
  const counts = {};
  loadFavorites().forEach(function (key) {
    const el = document.querySelector('[data-favorite-key="' + key + '"][data-name]');
    if (!el) return;
    const card = el.closest('.game-card');
    const gamePk = el.dataset.gamePk || (card && card.dataset.gamePk);
    if (!gamePk) return;
    counts[gamePk] = (counts[gamePk] || 0) + 1;
  });
  document.querySelectorAll('.fav-count-badge').forEach(function (badge) {
    const n = counts[badge.dataset.gamePk] || 0;
    if (n > 0) {
      badge.textContent = '♥ ' + n + (n === 1 ? ' favorite' : ' favorites');
      badge.style.display = '';
    } else {
      badge.style.display = 'none';
    }
  });
}

function toggleFavorite(e, key) {
  e.stopPropagation(); // don't also trigger the row's own toggleDetail() expand/collapse
  e.preventDefault(); // moneyline/run line/total hearts sit inside <summary>, which natively
  // toggles the whole game card open/closed on any click -- stopPropagation alone doesn't
  // stop that native behavior, only a JS listener further up the tree
  let keys = loadFavorites();
  if (keys.indexOf(key) === -1) {
    keys.push(key);
  } else {
    keys = keys.filter(function (k) { return k !== key; });
  }
  saveFavorites(keys);
  syncFavoriteButtons();
  renderFavoritesPanel();
}

function removeFavorite(e, key) {
  e.stopPropagation();
  saveFavorites(loadFavorites().filter(function (k) { return k !== key; }));
  syncFavoriteButtons();
  renderFavoritesPanel();
}

function renderFavoritesPanel() {
  const keys = loadFavorites();
  const listEl = document.getElementById('favorites-list');
  if (!listEl) return;
  if (!keys.length) {
    listEl.innerHTML = '<div class="favorite-empty">No favorites yet -- tap the heart next to any player or moneyline/run line/total pick to add one.</div>';
    return;
  }
  listEl.innerHTML = keys.map(function (key) {
    const el = document.querySelector('[data-favorite-key="' + key + '"][data-name]');
    const name = el ? el.dataset.name : ('Not in today\'s games (' + key + ')');
    let sub = el ? '' : '<div class="sub">Not in today\'s games</div>';
    if (el && el.dataset.gameTimeUtc) {
      sub = '<div class="sub game-time" data-utc="' + el.dataset.gameTimeUtc + '">' + el.dataset.gameTimeUtc + '</div>';
    }
    return (
      '<div class="favorite-item' + (el ? '' : ' favorite-item-missing') + '" onclick="jumpToFavorite(\'' + key + '\')">' +
      '<button type="button" class="favorite-item-remove" onclick="removeFavorite(event, \'' + key + '\')" title="Remove favorite">&times;</button>' +
      '<b>' + escapeHtml(name) + '</b>' + sub + '</div>'
    );
  }).join('');
  // New .game-time spans just introduced above need the same UTC->local
  // pass the rest of the page already got at DOMContentLoaded -- this
  // function is idempotent (re-reads data-utc, never mutates it), so
  // calling it again here is safe.
  localizeGameTimes();
  updateFavoriteCounts();
}

function toggleFavoritesPanel() {
  document.getElementById('favorites-panel').classList.toggle('open');
}

// "Tap into it just like the game stuff": a favorited player or team pick
// already on the page (a game-card row, a Top Overs/Unders pick card, or
// a moneyline/run line/total line) gets scrolled to and, for a row with
// its own expandable detail, opened the same way clicking it directly
// would -- reusing toggleDetail()'s own row rather than re-deriving a
// parallel view.
function jumpToFavorite(key) {
  document.getElementById('favorites-panel').classList.remove('open');
  const row = document.querySelector('.player-row[data-favorite-key="' + key + '"], .pitcher-row[data-favorite-key="' + key + '"]');
  if (row) {
    const details = row.closest('details.game-card');
    if (details && !details.open) details.open = true;
    requestAnimationFrame(function () {
      const detailRow = document.getElementById(row.dataset.rowId);
      if (detailRow && detailRow.style.display === 'none') row.click();
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    return;
  }
  const card = document.querySelector('.pick-card[data-favorite-key="' + key + '"]');
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  // A moneyline/run line/total favorite has no row of its own to expand --
  // just open that game's card (if collapsed) and scroll to its line.
  const teamPick = document.querySelector('[data-favorite-key="' + key + '"]');
  if (teamPick) {
    const details = teamPick.closest('details.game-card');
    if (details && !details.open) details.open = true;
    requestAnimationFrame(function () { teamPick.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
  }
}
function switchTeamTab(btn, side) {
  const tabsRow = btn.parentElement;
  tabsRow.querySelectorAll('.team-tab').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  const teamsDiv = tabsRow.nextElementSibling;
  if (teamsDiv) teamsDiv.dataset.activeSide = side;
}

// Quick-look batting overlay -- tap "Batting" on a game's summary row to
// see both starting lineups at a glance without opening the full
// accordion body below. Built once and reused (repopulated on every open)
// rather than one overlay per game card, since only one can ever be open
// at a time. Deliberately reads its content straight out of the DOM this
// same card's full accordion body already rendered instead of a second,
// separate data payload -- the quick view can never show something the
// full expand disagrees with, and no new data plumbing was needed at all.
let battingOverlayBackdrop = null;

function ensureBattingOverlay() {
  if (battingOverlayBackdrop) return battingOverlayBackdrop;
  const backdrop = document.createElement('div');
  backdrop.className = 'bo-backdrop';
  backdrop.innerHTML =
    '<div class="bo-sheet" role="dialog" aria-modal="true">' +
      '<div class="bo-header">' +
        '<div><div class="bo-title" id="boTitle"></div><div class="bo-subtitle" id="boSubtitle"></div></div>' +
        '<button type="button" class="bo-close" id="boCloseBtn" aria-label="Close">&times;</button>' +
      '</div>' +
      '<div class="bo-columns" id="boColumns"></div>' +
    '</div>';
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', function (e) { if (e.target === backdrop) closeBattingOverlay(); });
  backdrop.querySelector('#boCloseBtn').addEventListener('click', closeBattingOverlay);
  battingOverlayBackdrop = backdrop;
  return backdrop;
}

function closeBattingOverlay() {
  if (battingOverlayBackdrop) battingOverlayBackdrop.classList.remove('open');
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && battingOverlayBackdrop && battingOverlayBackdrop.classList.contains('open')) closeBattingOverlay();
});

function boBuildTeamColumn(details, side) {
  const col = details.querySelector('.team-col[data-side="' + side + '"]');
  if (!col) return '<div class="bo-empty">No lineup data yet</div>';
  const pitcherLine = col.querySelector('.pitcher-block .pitcher-line');
  let pitcherHtml = '<div class="bo-pitcher">No probable pitcher announced</div>';
  // _pitcher_html(None, ...) renders its own "No probable pitcher
  // announced" placeholder as a *different* div that still carries the
  // same .pitcher-line class (just with an extra "sub" class) -- data-name
  // only ever exists on the real, populated pitcher-line, so it's what
  // actually distinguishes "no pitcher yet" from "a pitcher is announced."
  if (pitcherLine && pitcherLine.dataset.name) {
    const photo = pitcherLine.querySelector('.player-photo');
    const badges = Array.from(pitcherLine.querySelectorAll('.badge')).map(function (b) { return b.outerHTML; }).join(' ');
    pitcherHtml = '<div class="bo-pitcher">' + (photo ? photo.outerHTML : '') +
      '<b>' + escapeHtml(pitcherLine.dataset.name || '') + '</b> ' + badges + '</div>';
  }
  const rows = Array.from(col.querySelectorAll('.batter-block tbody tr.player-row')).map(function (row) {
    const order = row.querySelector('[data-label="Order"]');
    const photo = row.querySelector('.player-photo');
    const flagsCell = row.querySelector('[data-label="Flags"]');
    const badges = flagsCell ? Array.from(flagsCell.querySelectorAll('.badge')).map(function (b) { return b.outerHTML; }).join(' ') : '';
    // _best_prop_html(b) renders inline in this SAME row's own "Recent
    // form" cell (not the separate hidden prop-detail row below it).
    const bestPropEl = row.querySelector('[data-label="Recent form"] .best-prop');
    return '<div class="bo-player-row">' +
      '<span class="bo-order">' + (order ? escapeHtml(order.textContent.trim()) : '') + '</span>' +
      (photo ? photo.outerHTML : '') +
      '<div class="bo-player-info"><div class="bo-player-name">' + escapeHtml(row.dataset.name || '') + ' ' + badges + '</div>' +
      (bestPropEl ? bestPropEl.outerHTML : '') + '</div></div>';
  }).join('');
  return pitcherHtml + (rows || '<div class="bo-empty">No batters announced yet</div>');
}

function openBattingOverlay(gamePk) {
  const details = document.querySelector('details.game-card[data-game-pk="' + gamePk + '"]');
  if (!details) return;
  const matchupTitle = details.querySelector('.matchup-title');
  const parts = matchupTitle ? matchupTitle.textContent.split(' @ ') : ['Away', 'Home'];
  const awayName = parts[0] || 'Away', homeName = parts[1] || 'Home';
  const gameTimeEl = details.querySelector('.game-time');
  const backdrop = ensureBattingOverlay();
  backdrop.querySelector('#boTitle').textContent = awayName + ' @ ' + homeName;
  backdrop.querySelector('#boSubtitle').textContent = gameTimeEl ? gameTimeEl.textContent : '';
  backdrop.querySelector('#boColumns').innerHTML =
    '<div><div class="bo-team-title">' + escapeHtml(awayName) + '</div>' + boBuildTeamColumn(details, 'away') + '</div>' +
    '<div><div class="bo-team-title">' + escapeHtml(homeName) + '</div>' + boBuildTeamColumn(details, 'home') + '</div>';
  backdrop.classList.add('open');
}
function playHighlight(el) {
  // Nothing is fetched for a collapsed/unclicked clip -- the <video> element
  // (and its network request) is only created the moment someone clicks.
  if (el.dataset.played === 'true') return;
  const url = el.dataset.videoUrl;
  const wrap = el.querySelector('.highlight-thumb-wrap');
  if (!url || !wrap) return;
  el.dataset.played = 'true';
  wrap.innerHTML = '';
  const video = document.createElement('video');
  video.controls = true;
  video.autoplay = true;
  video.playsInline = true;
  video.src = url;
  wrap.appendChild(video);
}
function localizeGameTimes() {
  document.querySelectorAll('.game-time').forEach(function (el) {
    const iso = el.dataset.utc;
    if (!iso) return;
    const d = new Date(iso);
    if (isNaN(d.getTime())) return;
    el.textContent = d.toLocaleString([], {
      weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });
  });
}
// Accordion: opening one game card closes any other open one. With every
// card able to expand into a long batter/pitcher/live-tracker body, having
// several open at once made the page enormous and hard to navigate --
// only ever one open keeps the page scannable, and (with the sticky
// summary above) there's always exactly one header to find and click.
function initGameCardAccordion() {
  const cards = document.querySelectorAll('details.game-card');
  cards.forEach(function (card) {
    card.addEventListener('toggle', function () {
      if (!card.open) return;
      cards.forEach(function (other) {
        if (other !== card) other.open = false;
      });
    });
  });
}
// This page (and my-bets.html / track-record.html, which share this same
// script) only get new content when a GitHub Actions run rebuilds and
// redeploys output/ -- previously that meant a visitor had to remember to
// manually reload to ever see a newly-confirmed lineup or a fresher line,
// even if they left the tab open all afternoon. latest.json is the
// smallest file the build already produces every run, so polling just its
// top-level generated_at is enough to detect "a new build landed" without
// re-fetching the whole (100k+ line) page on every check.
const AUTO_REFRESH_POLL_MS = 45000;
const AUTO_REFRESH_IDLE_RELOAD_MS = 20000;
let lastKnownGeneratedAt = null;
let idleReloadTimer = null;

function initAutoRefresh() {
  checkForNewData();
  setInterval(checkForNewData, AUTO_REFRESH_POLL_MS);
  // A backgrounded tab isn't being read, so it's safe to just reload the
  // instant it's looked at again rather than waiting for the next poll or
  // making the visitor click anything.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (document.getElementById('newDataBanner')) { location.reload(); return; }
    checkForNewData();
  });
}

function checkForNewData() {
  if (document.visibilityState === 'hidden') return;
  fetch('latest.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.generated_at) return;
      // First check just learns the current build's timestamp -- there's
      // nothing to compare against yet, and the page the visitor already
      // has open IS that build.
      if (lastKnownGeneratedAt === null) { lastKnownGeneratedAt = data.generated_at; return; }
      if (data.generated_at !== lastKnownGeneratedAt) showNewDataBanner();
    })
    .catch(function () {}); // transient network hiccup -- just try again next poll
}

function showNewDataBanner() {
  if (document.getElementById('newDataBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'newDataBanner';
  banner.innerHTML = 'New odds, lineups, or stats are available.' +
    '<button type="button" id="newDataRefreshBtn">Refresh now</button>' +
    '<button type="button" class="dismiss" id="newDataDismissBtn" aria-label="Dismiss">&times;</button>';
  document.body.appendChild(banner);
  document.getElementById('newDataRefreshBtn').addEventListener('click', function () { location.reload(); });
  document.getElementById('newDataDismissBtn').addEventListener('click', function () {
    banner.remove();
    clearTimeout(idleReloadTimer);
  });
  // Reload on its own once the visitor stops actively interacting, so
  // nobody has to remember to click "Refresh now" -- but never mid-scroll
  // or mid-read, since any of these events keeps pushing the reload back.
  const resetIdleTimer = function () {
    clearTimeout(idleReloadTimer);
    idleReloadTimer = setTimeout(function () { location.reload(); }, AUTO_REFRESH_IDLE_RELOAD_MS);
  };
  ['mousemove', 'keydown', 'touchstart', 'scroll', 'wheel'].forEach(function (evt) {
    document.addEventListener(evt, resetIdleTimer, { passive: true });
  });
  resetIdleTimer();
}

function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  function updateLabel() {
    const current = document.documentElement.getAttribute('data-theme');
    const isDark = current ? current === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    btn.textContent = isDark ? 'Switch to light' : 'Switch to dark';
  }
  btn.addEventListener('click', function () {
    const current = document.documentElement.getAttribute('data-theme');
    const isDark = current ? current === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateLabel();
  });
  updateLabel();
}
// Live game tracker: polls MLB's own public live-feed API (CORS-open,
// verified: access-control-allow-origin: *) directly from the browser, on
// a short interval -- our own build only regenerates every ~15 minutes,
// which is far too slow for "is this at-bat still going." Only ever reads
// from MLB's API; never writes anything, so there's no auth/key needed.
const LIVE_POLL_MS = 30000;

function gameHasStarted(el) {
  const timeEl = el.querySelector('.game-time');
  const t = timeEl ? timeEl.dataset.utc : null;
  if (!t) return false;
  const startMs = new Date(t).getTime();
  return !isNaN(startMs) && startMs <= Date.now(); // don't waste requests on a game that hasn't started yet
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// Real hover/tap tooltip for .prop-bar (recent-game prop-history bars) --
// a plain title="" attribute never fires on tap on mobile and can't be
// styled, and a dataset this size can render hundreds of these bars, so a
// single delegated listener (not one per bar) is what actually scales.
// Each bar's own aria-label carries the same "N stat on DATE — over/under
// the LINE line" text for screen readers, so this tooltip is a visual
// convenience layered on top of that, not the only way to get the info.
let chartTooltipEl = null;

function ensureChartTooltip() {
  if (!chartTooltipEl) {
    chartTooltipEl = document.createElement('div');
    chartTooltipEl.className = 'chart-tooltip';
    document.body.appendChild(chartTooltipEl);
  }
  return chartTooltipEl;
}

function showChartTooltip(bar, x, y) {
  const text = bar.dataset.tooltip;
  if (!text) return;
  const el = ensureChartTooltip();
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.classList.add('show');
}

function hideChartTooltip() {
  if (chartTooltipEl) chartTooltipEl.classList.remove('show');
}

function initChartTooltip() {
  document.addEventListener('mouseover', function (e) {
    const bar = e.target.closest('.prop-bar');
    if (bar) showChartTooltip(bar, e.clientX, e.clientY - 8);
  });
  document.addEventListener('mousemove', function (e) {
    if (!chartTooltipEl || !chartTooltipEl.classList.contains('show')) return;
    if (e.target.closest('.prop-bar')) {
      chartTooltipEl.style.left = e.clientX + 'px';
      chartTooltipEl.style.top = (e.clientY - 8) + 'px';
    }
  });
  document.addEventListener('mouseout', function (e) {
    if (e.target.closest('.prop-bar')) hideChartTooltip();
  });
  document.addEventListener('touchstart', function (e) {
    const bar = e.target.closest('.prop-bar');
    if (!bar) { hideChartTooltip(); return; }
    const t = e.touches[0];
    showChartTooltip(bar, t.clientX, t.clientY - 8);
  }, { passive: true });
  document.addEventListener('touchend', function () {
    // Touch has no "hover and read" state, only a single tap -- leave the
    // tooltip up briefly after lifting a finger so it's actually readable.
    setTimeout(hideChartTooltip, 1500);
  }, { passive: true });
}

// Same MLB CDN as _player_photo_html() in the Python template -- kept in
// lockstep so a player looks the same whether their card came from the
// server-rendered build or this client-side live update.
function playerPhotoHtml(id) {
  if (!id) return '';
  const url = 'https://img.mlbstatic.com/mlb-photos/image/upload/w_56,h_56,c_fill,g_face,q_100/v1/people/' + id + '/headshot/67/current';
  return '<img class="player-photo" src="' + url + '" loading="lazy" alt="" onerror="this.style.display=\'none\'">';
}

function initLiveTracker() {
  const allCards = Array.from(document.querySelectorAll('details.game-card[data-game-pk]'));
  // A game already Final as of this build still gets exactly ONE poll of
  // MLB's real feed (not part of the recurring pollAllLiveGames sweep below
  // -- no point re-polling a decided game every 30s forever). Our own
  // server-rendered box score only has a container for players who had a
  // prop projection to begin with (the starting lineup + probable pitcher)
  // -- a reliever or pinch-hitter who never got one needs this one real
  // fetch for updatePlayerBoxScores' subs-list handling to ever see them.
  allCards.filter(function (el) { return el.dataset.final === 'true' && gameHasStarted(el); }).forEach(pollLiveGame);
  // Always start the recurring poll, even if every game is still Scheduled
  // right now -- pollAllLiveGames() re-checks which cards have started on
  // every tick instead of trusting a list frozen at page-load time. That
  // used to matter a lot: a morning visit (every game still hours from
  // first pitch) made the old liveTrackedEls list empty, which returned
  // here before setInterval/visibilitychange were ever registered -- so a
  // tab left open all day never picked up games that went live later
  // without a manual reload.
  pollAllLiveGames();
  setInterval(pollAllLiveGames, LIVE_POLL_MS);
  pollAllUpcomingLineups();
  setInterval(pollAllUpcomingLineups, LINEUP_POLL_MS);
  // A backgrounded tab shouldn't keep polling every game on its own timer;
  // catching back up the moment the tab is visible again feels just as
  // "live" without burning requests the whole time no one's looking.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    pollAllLiveGames();
    pollAllUpcomingLineups();
  });
}

function pollAllLiveGames() {
  if (document.visibilityState === 'hidden') return;
  document.querySelectorAll('details.game-card[data-game-pk]').forEach(function (el) {
    // data-final ones are handled by the one-time poll in initLiveTracker;
    // pollLiveGame's own data-live-done check (below) already skips a game
    // that went Final *during* this session, so re-checking gameHasStarted
    // here is the only additional filter this recurring sweep needs.
    if (el.dataset.final === 'true' || !gameHasStarted(el)) return;
    pollLiveGame(el);
  });
}

// Lineup confirmations land 1-2 hours before first pitch -- exactly the
// window pollAllLiveGames() above deliberately ignores (gameHasStarted()
// gates it). Without this, "PROJECTED" -> "CONFIRMED" only ever updated on
// the next full rebuild (every ~15 min at best, longer if that scheduled
// run gets delayed), so a visitor with the tab open had to reload to see a
// lineup drop even though the confirmation itself is public the moment
// MLB posts it. Reuses the exact same feed/live endpoint and battingOrder
// %100 filtering sync_lineups.py uses server-side (see its own docstring)
// so "confirmed" can never mean something different client-side than it
// does in the next real build. Deliberately does NOT try to reconstruct
// the actual batting order/positions here -- that needs each player's
// season stats, matchup analysis, and prop lines, which live only in the
// synced DB and are computed at build time, not in MLB's live feed -- so
// this only flips the CONFIRMED/PROJECTED badges live; the full lineup
// card still needs the next rebuild for names/props to catch up. 90s
// polling (vs. 30s for live in-game state) since a lineup posting isn't a
// bursty, second-to-second event.
const LINEUP_POLL_MS = 90000;

function sideHasConfirmedBattingOrder(teamBox) {
  const players = (teamBox && teamBox.players) || {};
  return Object.keys(players).some(function (k) {
    const bo = players[k] && players[k].battingOrder;
    return bo != null && Number(bo) % 100 === 0;
  });
}

function markSideConfirmed(details, side) {
  const col = details.querySelector('.team-col[data-side="' + side + '"]');
  const badge = col ? col.querySelector('.team-title .badge-projected') : null;
  if (badge) {
    badge.textContent = 'CONFIRMED';
    badge.classList.remove('badge-projected');
    badge.classList.add('badge-confirmed');
  }
  details.dataset.confirmed = 'true';
  if (!details.querySelector('.summary-flags .badge-confirmed')) {
    const flags = details.querySelector('.summary-flags');
    if (flags) flags.insertAdjacentHTML('afterbegin', '<span class="badge badge-confirmed">CONFIRMED</span>');
  }
}

function pollUpcomingLineup(el) {
  const pk = el.dataset.gamePk;
  fetch('https://statsapi.mlb.com/api/v1.1/game/' + pk + '/feed/live')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      const box = (data.liveData || {}).boxscore || {};
      const teams = box.teams || {};
      ['home', 'away'].forEach(function (side) {
        if (sideHasConfirmedBattingOrder(teams[side])) markSideConfirmed(el, side);
      });
      if (document.getElementById('dateFilter')) applyFilters();
    })
    .catch(function () {}); // transient network hiccup -- just try again next cycle
}

function pollAllUpcomingLineups() {
  if (document.visibilityState === 'hidden') return;
  document.querySelectorAll('details.game-card[data-game-pk]').forEach(function (el) {
    if (el.dataset.final === 'true' || gameHasStarted(el)) return;
    // Nothing left to detect once both sides already show CONFIRMED --
    // .badge-projected being entirely absent is exactly that condition.
    if (!el.querySelector('.team-title .badge-projected')) return;
    pollUpcomingLineup(el);
  });
}

// MLB's own official win-probability endpoint -- computed from real
// historical play-by-play outcome frequencies (score/inning/outs/base-
// state), not a hand-rolled approximation. Free, keyless, same domain as
// everything else this tracker already polls. Updates once per COMPLETED
// play (not mid-at-bat), so it can lag the very latest pitch by one at-bat
// -- traded deliberately for being the more accurate number the rest of
// the time; computeWinProbability() below is the fallback for whenever
// this hasn't got a play yet (very start of a game) or the fetch fails.
function fetchGameWinProbability(gamePk) {
  return fetch('https://statsapi.mlb.com/api/v1/game/' + gamePk + '/winProbability')
    .then(function (r) { return r.json(); })
    .then(function (plays) {
      if (!Array.isArray(plays) || !plays.length) return null;
      const last = plays[plays.length - 1];
      return last.homeTeamWinProbability != null ? last.homeTeamWinProbability / 100 : null;
    })
    .catch(function () { return null; }); // never blocks the main live update below on this alone
}

function pollLiveGame(el) {
  if (el.dataset.liveDone === 'true') return; // confirmed Final by a previous poll -- stop hitting the API for it
  const pk = el.dataset.gamePk;
  Promise.all([
    fetch('https://statsapi.mlb.com/api/v1.1/game/' + pk + '/feed/live').then(function (r) { return r.json(); }),
    fetchGameWinProbability(pk),
  ])
    .then(function (results) { renderLiveState(el, results[0], results[1]); })
    .catch(function () { /* transient network hiccup -- keep last known state, just try again next cycle */ });
}

function statOr0(v) {
  return v == null ? 0 : v;
}

// Category label -> live box-score field, mirroring _BATTER_CATEGORY_FIELD/
// _PITCHER_CATEGORY_FIELD in build_props.py -- MLB's live feed uses
// camelCase where the synced DB schema uses snake_case, same stats.
const BATTER_LEAN_FIELD = {
  'Hits': 'hits', 'Total Bases': 'totalBases', 'Home Runs': 'homeRuns',
  'RBIs': 'rbi', 'Runs Scored': 'runs', 'Walks': 'baseOnBalls',
};
const PITCHER_LEAN_FIELD = {
  'Strikeouts': 'strikeOuts', 'Runs Allowed': 'earnedRuns',
  'Hits Allowed': 'hits', 'Walks Allowed': 'baseOnBalls',
};

// MLB's innings-pitched notation is whole innings + thirds after the
// decimal, NOT a real decimal ("6.1" = 6 innings + 1 out = 19 outs) --
// mirrors how the synced outs column is derived from this same raw field.
function outsFromInningsPitched(ip) {
  if (ip == null) return null;
  const parts = String(ip).split('.');
  const whole = parseInt(parts[0], 10) || 0;
  const thirds = parts[1] ? (parseInt(parts[1], 10) || 0) : 0;
  return whole * 3 + thirds;
}

function liveLeanValue(role, category, batting, pitching) {
  if (role === 'batter') {
    if (!batting || batting.atBats == null) return null; // hasn't batted yet
    // Combined stat -- no single live-feed field for it, mirrors h_r_rbi's
    // own derivation in build_props.py (hits + runs + rbi).
    if (category === 'Hits + Runs + RBIs') return statOr0(batting.hits) + statOr0(batting.runs) + statOr0(batting.rbi);
    const field = BATTER_LEAN_FIELD[category];
    return field ? statOr0(batting[field]) : null;
  }
  if (!pitching || pitching.inningsPitched == null) return null; // hasn't pitched yet
  if (category === 'Outs Recorded') return outsFromInningsPitched(pitching.inningsPitched);
  const field = PITCHER_LEAN_FIELD[category];
  return field ? statOr0(pitching[field]) : null;
}

// Mirrors pick_result()'s exact asymmetric logic in build_props.py: a
// cleared OVER/UNDER is a permanent fact the instant it happens (every one
// of these stats only ever goes up over a game), safe to show live; the
// reverse only locks in once the game's actually Final.
function liveLeanResult(value, line, direction, isFinal) {
  const cleared = value > line;
  if (!cleared && !isFinal) return null;
  return (direction === 'over' ? cleared : !cleared) ? 'hit' : 'miss';
}

// Closes the gap between this live 30s poll and the server-rendered
// "Predicted: X" verdict, which only updates on the next build_props.py
// run (up to an hour+ away) -- confirmed on a real case where the box
// score already showed a clearing hit while the server-side badge still
// showed nothing at all, because sync_stats.py hadn't synced that at-bat
// into the DB column pick_result() reads from yet.
function updateMatchupLeanLive(el, pid, batting, pitching, isFinal) {
  const leanEl = el.querySelector('.matchup-lean[data-player-id="' + pid + '"]');
  if (!leanEl) return;
  const role = leanEl.dataset.role;
  const category = leanEl.dataset.category;
  const line = parseFloat(leanEl.dataset.line);
  const direction = leanEl.dataset.direction;
  const value = liveLeanValue(role, category, batting, pitching);
  if (value == null) return;
  const result = liveLeanResult(value, line, direction, isFinal);
  if (!result) return;
  const existing = leanEl.querySelector('.badge');
  if (existing && existing.textContent === result.toUpperCase()) return;
  if (existing) existing.remove();
  leanEl.insertAdjacentHTML('beforeend', ' <span class="badge badge-' + result + '">' + result.toUpperCase() + '</span>');
}

// Same idea as updateMatchupLeanLive(), for the separate Top Overs/Unders
// leaderboard cards -- these live outside any single game's card element,
// so this queries the whole document by game_pk+player_id instead of a
// scoped .querySelector() within one game's own DOM subtree.
function updatePickCardLive(gamePk, pid, batting, pitching, isFinal) {
  const cards = document.querySelectorAll('.pick-card[data-game-pk="' + gamePk + '"][data-player-id="' + pid + '"]');
  cards.forEach(function (card) {
    const role = card.dataset.role;
    const category = card.dataset.category;
    const line = parseFloat(card.dataset.line);
    const direction = card.dataset.direction;
    const value = liveLeanValue(role, category, batting, pitching);
    if (value == null) return;
    const result = liveLeanResult(value, line, direction, isFinal);
    if (!result) return;
    const badgesEl = card.querySelector('.pick-badges');
    if (!badgesEl) return;
    const existing = badgesEl.querySelector('.badge-hit, .badge-miss, .badge-dnp');
    if (existing && existing.textContent === result.toUpperCase()) return;
    if (existing) existing.remove();
    badgesEl.insertAdjacentHTML('beforeend', '<span class="badge badge-' + result + '">' + result.toUpperCase() + '</span>');
  });
}

function boxHeader(isFinal, volumeLabel, volumeValue) {
  const badge = isFinal ? '<span class="badge badge-final">FINAL</span>' : '<span class="badge badge-live">LIVE</span>';
  const volume = volumeLabel ? '<span class="bx-volume">' + volumeValue + ' ' + volumeLabel + '</span>' : '';
  return '<div class="bx-header">' + badge + volume + '</div>';
}

function statCellHtml(label, value) {
  return '<div class="bx-stat"><b>' + value + '</b><small>' + label + '</small></div>';
}

// Main grid leads with IP then exactly PITCHER_PROP_CATEGORIES (Strikeouts,
// Runs Allowed = earned runs, Hits Allowed, Walks Allowed) -- see
// _pitcher_boxscore_html()'s own docstring. Shared by the known-player path
// (a container already on the page) and the subs path (a player who never
// got one) below, so the two can't drift out of sync.
function pitchingGridHtml(pitching) {
  const grid = [
    statCellHtml('IP', pitching.inningsPitched), statCellHtml('SO', statOr0(pitching.strikeOuts)),
    statCellHtml('ER', statOr0(pitching.earnedRuns)), statCellHtml('H', statOr0(pitching.hits)), statCellHtml('BB', statOr0(pitching.baseOnBalls)),
  ].join('');
  const extraCells = [];
  if (statOr0(pitching.runs) !== statOr0(pitching.earnedRuns)) extraCells.push(statCellHtml('R', statOr0(pitching.runs)));
  if (pitching.homeRuns) extraCells.push(statCellHtml('HR', pitching.homeRuns));
  // Not a graded prop category (see PITCHER_PROP_CATEGORIES), so it's an
  // extra rather than in the main 5-cell grid -- but genuinely live-only:
  // our own synced pitching_game_logs schema has no such column at all,
  // so this can only ever come from MLB's own live feed, never the
  // server-rendered initial box.
  if (pitching.numberOfPitches) extraCells.push(statCellHtml('NP', pitching.numberOfPitches));
  const extra = extraCells.length ? '<div class="bx-grid">' + extraCells.join('') + '</div>' : '';
  return '<div class="bx-grid">' + grid + '</div>' + extra;
}

// Main grid leads with AB then exactly BATTER_PROP_CATEGORIES (Hits, Total
// Bases, Home Runs, RBIs, Runs Scored, Walks).
function battingGridHtml(batting) {
  const grid = [
    statCellHtml('AB', statOr0(batting.atBats)), statCellHtml('H', statOr0(batting.hits)), statCellHtml('TB', statOr0(batting.totalBases)),
    statCellHtml('HR', statOr0(batting.homeRuns)), statCellHtml('RBI', statOr0(batting.rbi)), statCellHtml('R', statOr0(batting.runs)),
    statCellHtml('BB', statOr0(batting.baseOnBalls)),
  ].join('');
  const extraCells = [];
  if (batting.doubles) extraCells.push(statCellHtml('2B', batting.doubles));
  if (batting.triples) extraCells.push(statCellHtml('3B', batting.triples));
  if (batting.stolenBases) extraCells.push(statCellHtml('SB', batting.stolenBases));
  const extra = extraCells.length ? '<div class="bx-grid">' + extraCells.join('') + '</div>' : '';
  return '<div class="bx-grid">' + grid + '</div>' + extra;
}

// A reliever or pinch-hitter/defensive sub never got a table row -- only
// players with a prop projection (the confirmed/projected lineup + probable
// starter) do. Rather than silently drop their live stats, append a compact
// line to that side's .subs-list instead: no props (nothing was projected
// for them), just their actual line, so they're not just missing. Grouped
// into its own Pitching/Batting subsection (not one flat list) -- a reliever
// buried between two pinch-hitters read as a jumbled arrival-order list.
function upsertSubLine(el, side, pid, name, gridHtml, isFinal, kind) {
  const list = el.querySelector('.subs-list[data-side="' + side + '"]');
  if (!list) return;
  if (!list.querySelector('.subs-list-heading')) {
    // Both groups created together, in a fixed Pitching-then-Batting order,
    // regardless of which kind happens to be seen first in this poll.
    list.innerHTML =
      '<div class="subs-list-heading">Also appeared</div>' +
      '<div class="subs-group" data-kind="pitching"><div class="subs-group-heading">Pitching</div></div>' +
      '<div class="subs-group" data-kind="batting"><div class="subs-group-heading">Batting</div></div>';
  }
  const group = list.querySelector('.subs-group[data-kind="' + kind + '"]');
  let line = group.querySelector('.sub-player-line[data-player-id="' + pid + '"]');
  if (!line) {
    line = document.createElement('div');
    line.className = 'sub-player-line';
    line.dataset.playerId = pid;
    line.innerHTML = '<div class="sub-player-name">' + playerPhotoHtml(pid) + escapeHtml(name) + ' <span class="sub">(not projected)</span></div>';
    group.appendChild(line);
  }
  const nameDiv = line.querySelector('.sub-player-name').outerHTML;
  line.innerHTML = nameDiv + boxHeader(isFinal) + gridHtml;
}

// Every player in the boxscore (batting AND pitching stats keyed by
// person.id), re-rendered from the SAME fetch that drives the live strip
// above -- our own build only refreshes every ~15 minutes, so without
// this a player's card can sit on whatever partial line it had at the
// last build (see live_score's own docstring in build_props.py for a
// real example this bit us on) long after the real number moved on.
function updatePlayerBoxScores(el, data, isFinal) {
  const box = ((data.liveData || {}).boxscore || {}).teams || {};
  const gamePk = el.dataset.gamePk;
  ['home', 'away'].forEach(function (side) {
    const players = (box[side] || {}).players || {};
    Object.keys(players).forEach(function (key) {
      const p = players[key];
      const pid = p.person && p.person.id;
      if (!pid) return;
      const pitching = p.stats && p.stats.pitching;
      const batting = p.stats && p.stats.batting;
      updateMatchupLeanLive(el, pid, batting, pitching, isFinal);
      updatePickCardLive(gamePk, pid, batting, pitching, isFinal);
      const container = el.querySelector('.boxscore-line[data-player-id="' + pid + '"]');
      const pitched = pitching && pitching.inningsPitched && (pitching.inningsPitched !== '0.0' || statOr0(pitching.battersFaced) > 0);
      const batted = batting && (batting.atBats != null) && (batting.atBats > 0 || statOr0(batting.plateAppearances) > 0);
      if (container) {
        if (pitched) container.innerHTML = boxHeader(isFinal) + pitchingGridHtml(pitching);
        else if (batting && batting.atBats != null) container.innerHTML = boxHeader(isFinal) + battingGridHtml(batting);
        return;
      }
      // No pre-rendered container for this person id -- a reliever, pinch
      // hitter, or defensive sub who wasn't in the projected/confirmed
      // lineup. Only worth a line once they've actually done something.
      if (pitched) upsertSubLine(el, side, pid, p.person.fullName, pitchingGridHtml(pitching), isFinal, 'pitching');
      else if (batted) upsertSubLine(el, side, pid, p.person.fullName, battingGridHtml(batting), isFinal, 'batting');
    });
  });
}

// Only the "something actually happened" action events -- MLB's feed logs
// a lot of routine noise alongside these (batter timeouts, mound visits,
// game-status advisories) that isn't worth a line in a recap feed.
function isNotableAction(event) {
  if (!event) return false;
  if (event.indexOf('Stolen Base') === 0 || event.indexOf('Caught Stealing') === 0) return true;
  return ['Pitching Substitution', 'Offensive Substitution', 'Defensive Sub', 'Defensive Switch', 'Wild Pitch', 'Passed Ball', 'Balk', 'Injury', 'Ejection'].indexOf(event) !== -1;
}

// Shared by the full "Recent plays" list (in the expanded card) and the
// always-visible live strip's "most recent notable event" line below --
// one pass over the same fetch, not two.
function collectGameEvents(data) {
  const allPlays = ((data.liveData || {}).plays || {}).allPlays || [];
  const events = [];
  allPlays.forEach(function (p) {
    const inning = (p.about.halfInning || '') + ' ' + (p.about.inning || '');
    (p.playEvents || []).forEach(function (pe) {
      if (pe.type === 'action' && pe.details && isNotableAction(pe.details.event) && pe.details.description) {
        events.push({ inning: inning, text: pe.details.description, action: true });
      }
    });
    if (p.result && p.result.description) {
      events.push({ inning: inning, text: p.result.description, action: false, scoring: !!p.about.isScoringPlay });
    }
  });
  return events;
}

function renderRecentPlays(el, events) {
  const container = el.querySelector('.recent-plays');
  if (!container || !events.length) return;
  const recent = events.slice(-15).reverse();
  container.innerHTML =
    '<div class="plays-heading">Recent plays</div>' +
    recent
      .map(function (e) {
        const cls = (e.action ? ' play-action' : '') + (e.scoring ? ' play-scoring' : '');
        return (
          '<div class="play-row' + cls + '">' +
          '<span class="play-inning">' + escapeHtml(e.inning) + '</span>' +
          '<span class="play-text">' + escapeHtml(e.text) + '</span></div>'
        );
      })
      .join('');
}

// The full history lives in the expanded card (renderRecentPlays), which
// most visitors won't have open -- a pitching change or pinch-hitter is
// exactly the kind of thing worth surfacing without clicking in, so the
// SINGLE most recent one also gets a line in the always-visible strip.
// Only counts as "current" if it's among the last few events overall --
// otherwise a wild pitch or pitching change from 3 batters ago just sits
// there looking like old news forever (nothing else notable has to have
// happened since for the OLD scan-back-to-the-start version to keep
// re-showing it).
function latestNotableEvent(events) {
  const recent = events.slice(-3);
  for (let i = recent.length - 1; i >= 0; i--) {
    if (recent[i].action) return recent[i];
  }
  return null;
}

// A foul is a strike (barring the 2-strike exception) -- MLB's own feed
// agrees: called strike, swinging strike, and foul all carry the exact
// same "ballColor" in the raw pitch data, distinct only from balls and
// balls in play. Matching that instead of inventing a 4th "foul" color.
// Exactly 3 colors: blue (ball, incl. hit-by-pitch -- batter didn't swing,
// not charged as a strike), red (any kind of strike, fouls included), green
// (ball in play). Not a 4th color for the rare HBP case.
function pitchDotClass(desc) {
  if (!desc) return 'pitch-dot-other';
  if (desc.indexOf('In play') === 0) return 'pitch-dot-inplay';
  if (desc.indexOf('Ball') === 0 || desc === 'Automatic Ball' || desc.indexOf('Hit By Pitch') === 0) return 'pitch-dot-ball';
  return 'pitch-dot-strike'; // Called Strike, Swinging Strike, Foul, Foul Tip, Foul Bunt, ...
}

// MLB's live feed carries full Statcast pitch coordinates (pX/pZ, feet from
// the plate's center/ground) for every pitch of the CURRENT at-bat, plus
// this batter's own strike zone top/bottom -- exactly what MLB.com's own
// Gameday pitch tracker plots. Re-fetched (and so reset to the new
// at-bat's pitches) every poll, same as everything else in the tracker.
function renderStrikeZone(currentPlay) {
  const pitchEvents = ((currentPlay || {}).playEvents || []).filter(function (pe) {
    return pe.pitchData && pe.pitchData.coordinates && pe.pitchData.coordinates.pX != null;
  });
  if (!pitchEvents.length) return '';
  const last = pitchEvents[pitchEvents.length - 1].pitchData;
  const top = last.strikeZoneTop || 3.5;
  const bottom = last.strikeZoneBottom || 1.5;
  const halfWidth = (last.strikeZoneWidth || 17) / 12 / 2; // inches -> feet -> half-width
  // viewBox is 5ft wide (-2.5..2.5) by 5ft tall (0..5, ground to well above
  // the zone), 20px/ft; SVG y grows downward while pZ grows upward, so flip.
  const toX = function (ft) { return (ft + 2.5) * 20; };
  const toY = function (ft) { return (5 - ft) * 20; };
  const zoneX = toX(-halfWidth), zoneY = toY(top);
  const zoneW = toX(halfWidth) - zoneX, zoneH = toY(bottom) - zoneY;
  const dots = pitchEvents
    .map(function (pe, i) {
      const c = pe.pitchData.coordinates;
      const cls = pitchDotClass(pe.details && pe.details.description);
      const x = toX(c.pX), y = toY(c.pZ);
      const isLast = i === pitchEvents.length - 1;
      return (
        '<circle cx="' + x + '" cy="' + y + '" r="' + (isLast ? 8 : 7) + '" class="pitch-dot ' + cls + (isLast ? ' pitch-dot-current' : '') + '"></circle>' +
        '<text x="' + x + '" y="' + y + '" class="pitch-dot-num" text-anchor="middle" dominant-baseline="central">' + (i + 1) + '</text>'
      );
    })
    .join('');
  return (
    '<svg class="strike-zone" viewBox="0 0 100 100" width="84" height="84">' +
    '<rect x="0" y="0" width="100" height="100" class="sz-bg"></rect>' +
    '<rect x="' + zoneX + '" y="' + zoneY + '" width="' + zoneW + '" height="' + zoneH + '" class="sz-zone"></rect>' +
    dots +
    '</svg>'
  );
}

// The same per-pitch data (type + velocity from pitchData/details, the
// call/result already used to color the strike-zone dots) as a plain-
// language list, oldest first -- MLB.com's own Gameday shows exactly this
// alongside its zone plot.
function renderPitchSequence(currentPlay) {
  const pitchEvents = ((currentPlay || {}).playEvents || []).filter(function (pe) {
    return pe.pitchData && pe.details;
  });
  if (!pitchEvents.length) return '';
  const rows = pitchEvents
    .map(function (pe, i) {
      const type = (pe.details.type && pe.details.type.description) || 'Pitch';
      const speed = pe.pitchData.startSpeed;
      const speedHtml = speed != null ? '<span class="pitch-seq-speed">' + Math.round(speed) + ' mph</span>' : '';
      const cls = pitchDotClass(pe.details.description);
      return (
        '<div class="pitch-seq-row"><span class="pitch-seq-num">' + (i + 1) + '.</span>' +
        '<span class="pitch-seq-dot ' + cls + '"></span>' +
        speedHtml +
        '<span>' + escapeHtml(type) + ' &mdash; ' + escapeHtml(pe.details.description || '') + '</span></div>'
      );
    })
    .join('');
  return '<div class="pitch-seq"><div class="pitch-seq-heading">Pitch by pitch</div>' + rows + '</div>';
}

// Marks the current batter/on-deck hitter/pitcher's row so it's obvious at
// a glance where in the order the game actually is, instead of having to
// cross-reference the "Pitching / At bat / On deck" names against the
// batter table by eye. Cleared and reapplied every poll (nothing tracks
// its own previous state -- simplest to just recompute from scratch). This
// is a highlight on the row itself (tinted background + a plain colored
// text label next to the name), not another rounded .badge pill -- it
// needs to read as distinct from the HOT/COLD/matchup bubbles, not as one
// more bubble alongside them.
function clearLiveTags(el) {
  el.querySelectorAll('.live-tag').forEach(function (n) { n.remove(); });
  el.querySelectorAll('.player-row.is-batting, .player-row.is-ondeck').forEach(function (row) {
    row.classList.remove('is-batting', 'is-ondeck');
  });
  el.querySelectorAll('.pitcher-row.is-pitching').forEach(function (row) { row.classList.remove('is-pitching'); });
}
function addLiveTag(cell, label) {
  if (!cell) return;
  cell.insertAdjacentHTML('beforeend', '<span class="live-tag-text live-tag">' + label + '</span>');
}
function highlightActivePlayers(el, batterId, onDeckId, pitcherId) {
  clearLiveTags(el);
  if (batterId) {
    const row = el.querySelector('.player-row[data-player-id="' + batterId + '"]');
    if (row) {
      row.classList.add('is-batting');
      addLiveTag(row.querySelector('td.name-cell'), 'AT BAT');
    }
  }
  if (onDeckId) {
    const row = el.querySelector('.player-row[data-player-id="' + onDeckId + '"]');
    if (row) {
      row.classList.add('is-ondeck');
      addLiveTag(row.querySelector('td.name-cell'), 'ON DECK');
    }
  }
  if (pitcherId) {
    const row = el.querySelector('.pitcher-row[data-player-id="' + pitcherId + '"]');
    if (row) {
      row.classList.add('is-pitching');
      addLiveTag(row, 'PITCHING');
    }
  }
}

// Standard normal CDF via the Abramowitz & Stegun erf approximation --
// no server round-trip, so this has to be self-contained in the browser.
function normCdf(x) {
  const sign = x < 0 ? -1 : 1;
  const ax = Math.abs(x) / Math.SQRT2;
  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
  const t = 1 / (1 + p * ax);
  const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-ax * ax);
  return 0.5 * (1 + sign * y);
}

// A live in-game win-probability ESTIMATE, not MLB's own (proprietary) model
// -- built from first principles: treat each team's remaining scoring as
// normally distributed around the current lead, with variance shrinking as
// outs run out and a small fixed home-field edge (home teams win ~54% of
// season openers) that shrinks right along with it. Plus a small same-side
// bonus for the batting team's current base/out state (e.g. bases loaded,
// nobody out swings things back toward whoever's up). This is a real
// approximation, not a lookup from Statcast's actual win-expectancy table --
// good enough to be directionally right, not precise to the percentage point.
function computeWinProbability(linescore) {
  const inning = linescore.currentInning;
  if (!inning) return null;
  const isTop = linescore.isTopInning !== undefined ? linescore.isTopInning : (linescore.inningHalf || '') === 'Top';
  const outs = linescore.outs || 0;
  const home = (linescore.teams || {}).home || {};
  const away = (linescore.teams || {}).away || {};
  if (home.runs == null || away.runs == null) return null;
  const offense = linescore.offense || {};

  const outsPerSide = 3;
  const regulationOuts = 54; // 9 innings x 2 halves x 3 outs
  const outsCompleted = (inning - 1) * 6 + (isTop ? 0 : outsPerSide) + outs;
  const totalOuts = inning <= 9 ? regulationOuts : regulationOuts + (inning - 9) * 6;
  let outsRemaining = totalOuts - outsCompleted;
  const tied = home.runs === away.runs;
  if (outsRemaining <= 0 && tied) outsRemaining = 3; // heading to extras -- still very much live
  outsRemaining = Math.max(outsRemaining, 1);

  const baseBonus = (offense.first ? 0.15 : 0) + (offense.second ? 0.3 : 0) + (offense.third ? 0.35 : 0);
  const outMultiplier = outs === 0 ? 1 : outs === 1 ? 0.65 : 0.35;
  const runnerBonus = baseBonus * outMultiplier;

  const sigmaFull = 4.5; // ~typical SD of final run differential across a 9-inning game
  const sigma = Math.max(sigmaFull * Math.sqrt(outsRemaining / regulationOuts), 0.35);
  const homeEdgeFull = 0.452; // Phi(homeEdgeFull / sigmaFull) ~= 0.54, matching home teams' long-run win rate
  const homeEdge = homeEdgeFull * Math.sqrt(outsRemaining / regulationOuts);

  const lead = home.runs - away.runs + (isTop ? -runnerBonus : runnerBonus) + homeEdge;
  const homeWp = normCdf(lead / sigma);
  // Never claim near-certainty while the game's still live -- this is an
  // estimate, not an oracle.
  return Math.min(Math.max(homeWp, 0.02), 0.98);
}

function winProbHtml(linescore, gameData, realWp) {
  // realWp (from MLB's own winProbability endpoint, fetched alongside the
  // live feed in pollLiveGame) wins whenever it's available -- it's the
  // more accurate number, built from real historical game-flow outcomes
  // rather than a normal-distribution approximation. computeWinProbability()
  // is just the fallback for the handful of polls where it isn't (no
  // completed play yet, or that fetch specifically failed this cycle).
  const wp = realWp != null ? realWp : computeWinProbability(linescore);
  if (wp == null) return '';
  const homePct = Math.round(wp * 100);
  const awayPct = 100 - homePct;
  const teams = gameData.teams || {};
  const homeAbbr = (teams.home && (teams.home.abbreviation || teams.home.teamName)) || 'Home';
  const awayAbbr = (teams.away && (teams.away.abbreviation || teams.away.teamName)) || 'Away';
  const label = realWp != null ? 'Win probability' : 'Win probability (est.)';
  return (
    '<div class="wp-panel"><span class="wp-panel-label">' + escapeHtml(label) + '</span>' +
    '<div class="wp-bar"><div class="wp-bar-away" style="width:' + awayPct + '%"></div>' +
    '<div class="wp-bar-home" style="width:' + homePct + '%"></div></div>' +
    '<div class="wp-teams"><span>' + escapeHtml(awayAbbr) + ' <b>' + awayPct + '%</b></span>' +
    '<span>' + escapeHtml(homeAbbr) + ' <b>' + homePct + '%</b></span></div></div>'
  );
}

// Mirrors _game_line_html()'s own Final branch in the Python template
// (and grade_picks.py's _grade_games() grading rules) exactly, so the
// three can never disagree on what counts as a hit -- see this project's
// established pattern for keeping duplicated grading logic in lockstep.
// Needed client-side at all because that Python version only ever
// reaches the page on the NEXT full rebuild (every ~15-60 min); without
// this, a game that just went Final showed a bare score with no
// Moneyline/Run line/Total verdict for however long that gap lasted.
function gradeFinalGameLine(el, homeRuns, awayRuns) {
  if (el.dataset.mlPick === undefined) return; // no pre-game projection to grade against
  // .game-line only exists in the DOM if the game was still Scheduled (or
  // already Final) as of the last full rebuild -- _game_line_html() omits
  // it entirely once a game is seen as Live, and it only comes back,
  // freshly rendered, on the NEXT rebuild. A real game takes ~3 hours and
  // rebuilds happen every ~15-60 min, so by the time a game actually goes
  // Final, .game-line has almost always already been removed -- create it
  // fresh in that case rather than silently doing nothing.
  let line = el.querySelector('.game-line');
  if (!line) {
    const tracker = el.querySelector('.live-tracker');
    if (!tracker) return;
    line = document.createElement('div');
    line.className = 'game-line';
    tracker.parentNode.insertBefore(line, tracker);
  }

  const homeExp = parseFloat(el.dataset.homeExpRuns);
  const awayExp = parseFloat(el.dataset.awayExpRuns);
  const margin = homeRuns - awayRuns; // MLB games never end tied
  const badge = function (hit) { return '<span class="badge badge-' + (hit ? 'hit' : 'miss') + '">' + (hit ? 'HIT' : 'MISS') + '</span>'; };

  const mlPick = el.dataset.mlPick;
  const mlTeam = mlPick === 'home' ? el.dataset.homeTeam : el.dataset.awayTeam;
  const mlHit = (mlPick === 'home') === (margin > 0);
  let picksHtml = '<span>Moneyline: <b>' + escapeHtml(mlTeam) + '</b> ' + badge(mlHit) + '</span>';

  const spreadPick = el.dataset.spreadPick;
  const spreadFavorite = el.dataset.spreadFavorite;
  const spreadLine = parseFloat(el.dataset.spreadLine);
  const spreadTeam = spreadPick === 'home' ? el.dataset.homeTeam : el.dataset.awayTeam;
  const spreadSide = (spreadPick === spreadFavorite ? '-' : '+') + spreadLine;
  const favoriteMargin = spreadFavorite === 'home' ? margin : -margin;
  const favoriteCovers = favoriteMargin > spreadLine;
  const spreadHit = spreadPick === spreadFavorite ? favoriteCovers : !favoriteCovers;
  picksHtml += '<span>Run line: <b>' + escapeHtml(spreadTeam) + ' ' + spreadSide + '</b> ' + badge(spreadHit) + '</span>';

  const totalLine = parseFloat(el.dataset.totalLine);
  const totalPick = el.dataset.totalPick;
  const actualTotal = homeRuns + awayRuns;
  const totalHit = (actualTotal > totalLine) === (totalPick === 'over');
  picksHtml += '<span>Total ' + totalLine + ': <b>' + totalPick.toUpperCase() + '</b> ' + badge(totalHit) + '</span>';

  const diff = Math.round((actualTotal - (homeExp + awayExp)) * 10) / 10;
  const diffTxt = diff >= 0 ? ('+' + diff) : String(diff);

  line.innerHTML =
    '<span class="proj-score">Final score: ' + escapeHtml(el.dataset.awayTeam) + ' ' + awayRuns +
    ' &ndash; ' + escapeHtml(el.dataset.homeTeam) + ' ' + homeRuns + '</span>' +
    '<div class="proj-picks"><span>Projected: <b>' + awayExp + ' &ndash; ' + homeExp + '</b> (total off by ' + diffTxt + ')</span></div>' +
    '<div class="proj-picks">' + picksHtml + '</div>';
}

function renderLiveState(el, data, realWp) {
  const container = el.querySelector('.live-tracker'); // compact: sticky, in <summary>, visible even collapsed
  const detail = el.querySelector('.live-detail'); // heavier detail: NOT sticky, only in the expanded body
  const status = ((data.gameData || {}).status || {}).abstractGameState;
  const linescore = (data.liveData || {}).linescore || {};
  const events = collectGameEvents(data);

  if (status === 'Final') {
    el.dataset.liveDone = 'true';
    updatePlayerBoxScores(el, data, true);
    renderRecentPlays(el, events);
    highlightActivePlayers(el, null, null, null);
    if (detail) detail.innerHTML = '';
    const home = (linescore.teams || {}).home, away = (linescore.teams || {}).away;
    if (home && away && home.runs != null && away.runs != null) {
      gradeFinalGameLine(el, home.runs, away.runs);
    }
    if (!container) return;
    if (home && away && home.runs != null && away.runs != null) {
      container.innerHTML =
        '<span class="badge badge-final">FINAL</span><span class="live-score-line">' + away.runs + ' - ' + home.runs + '</span>';
    }
    return;
  }
  if (status !== 'Live') return; // still Preview (Scheduled/Pre-Game/Warmup/Delayed) -- nothing live to show yet

  updatePlayerBoxScores(el, data, false);
  renderRecentPlays(el, events);

  const home = (linescore.teams || {}).home || {};
  const away = (linescore.teams || {}).away || {};
  const outs = linescore.outs || 0;
  const offense = linescore.offense || {};
  const defense = linescore.defense || {};
  const batter = offense.batter ? offense.batter.fullName : null;
  const onDeck = offense.onDeck ? offense.onDeck.fullName : null;
  const inHole = offense.inHole ? offense.inHole.fullName : null;
  const pitcher = defense.pitcher ? defense.pitcher.fullName : null;
  highlightActivePlayers(el, offense.batter && offense.batter.id, offense.onDeck && offense.onDeck.id, defense.pitcher && defense.pitcher.id);
  const outDots = [0, 1, 2]
    .map(function (i) { return '<span class="out-dot' + (i < outs ? ' out-dot-filled' : '') + '"></span>'; })
    .join('');
  const diamond =
    '<div class="diamond">' +
    '<div class="base base-2b' + (offense.second ? ' base-occupied' : '') + '"></div>' +
    '<div class="base base-3b' + (offense.third ? ' base-occupied' : '') + '"></div>' +
    '<div class="base base-1b' + (offense.first ? ' base-occupied' : '') + '"></div>' +
    '</div>';
  const updated = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const latest = latestNotableEvent(events);
  const currentPlay = ((data.liveData || {}).plays || {}).currentPlay;
  const count = (currentPlay || {}).count || {};
  const countText = count.balls != null && count.strikes != null ? count.balls + '-' + count.strikes : '';
  const strikeZoneHtml = renderStrikeZone(currentPlay);
  const pitchSeqHtml = renderPitchSequence(currentPlay);
  const wpHtml = winProbHtml(linescore, data.gameData || {}, realWp);

  if (container) {
    container.innerHTML =
      '<div class="live-top-row">' +
      '<span class="badge badge-live">LIVE</span>' +
      '<span class="live-score-line">' + away.runs + ' - ' + home.runs + '</span>' +
      '<span class="live-inning">' + escapeHtml(linescore.inningHalf || '') + ' ' + escapeHtml(linescore.currentInningOrdinal || '') + '</span>' +
      '<span class="live-updated">updated ' + updated + '</span>' +
      '</div>' +
      '<div class="live-field-row">' +
      '<div class="live-state-panel">' +
      diamond +
      '<div class="live-count-outs">' +
      (countText ? '<span class="live-count">' + countText + '</span>' : '') +
      '<span class="live-outs">' + outDots + '</span>' +
      '</div>' +
      '</div>' +
      wpHtml +
      '</div>';
  }

  if (detail) {
    detail.innerHTML =
      '<div class="live-field-row">' +
      (strikeZoneHtml ? '<div class="sz-panel"><span class="sz-panel-label">Pitch location</span>' + strikeZoneHtml + '</div>' : '') +
      (batter || pitcher
        ? '<div class="live-matchup">' +
          (pitcher ? '<span class="live-batter">Pitching: ' + playerPhotoHtml(defense.pitcher && defense.pitcher.id) + '<b>' + escapeHtml(pitcher) + '</b></span>' : '') +
          (batter ? '<span class="live-batter">At bat: ' + playerPhotoHtml(offense.batter && offense.batter.id) + '<b>' + escapeHtml(batter) + '</b></span>' : '') +
          (onDeck ? '<span class="live-batter sub">On deck: ' + playerPhotoHtml(offense.onDeck && offense.onDeck.id) + escapeHtml(onDeck) + '</span>' : '') +
          (inHole ? '<span class="live-batter sub">In the hole: ' + playerPhotoHtml(offense.inHole && offense.inHole.id) + escapeHtml(inHole) + '</span>' : '') +
          '</div>'
        : '') +
      '</div>' +
      pitchSeqHtml +
      (latest ? '<div class="live-notable">' + escapeHtml(latest.text) + '</div>' : '');
  }
}

document.addEventListener('DOMContentLoaded', function () {
  // Guarded as a whole, not element-by-element: this script is shared with
  // pages (like track-record.html) that have no filter toolbar at all --
  // any one of these calling .addEventListener on a missing element would
  // throw and abort the rest of this handler, silently breaking initTheme()
  // and localizeGameTimes() too even though neither depends on the toolbar.
  if (document.getElementById('dateFilter')) {
    document.getElementById('dateFilter').addEventListener('change', applyFilters);
    document.getElementById('roleFilter').addEventListener('change', applyFilters);
    document.getElementById('searchBox').addEventListener('input', applyFilters);
    document.getElementById('confirmedOnly').addEventListener('change', applyFilters);
    applyFilters();
  }
  initTheme();
  localizeGameTimes();
  initLiveTracker();
  initAutoRefresh();
  initChartTooltip();
  initGameCardAccordion();
  syncStickyOffset();
  window.addEventListener('resize', syncStickyOffset);
  syncFavoriteButtons();
  renderFavoritesPanel();
});

// The filter toolbar (dropdowns/search) is its own sticky element pinned at
// top:0 -- an open game card's summary is ALSO sticky, and without this it
// would stack at the same top:0, letting the toolbar's higher z-index paint
// over the summary's own title/score. Measured live (not hardcoded) because
// the toolbar wraps to more rows, and gets taller, on narrow/mobile widths.
// No-op (falls back to the CSS default of 0px) on pages with no toolbar.
function syncStickyOffset() {
  const toolbar = document.querySelector('.toolbar');
  const height = toolbar ? toolbar.getBoundingClientRect().height : 0;
  document.documentElement.style.setProperty('--sticky-offset', height + 'px');
}
</script>
