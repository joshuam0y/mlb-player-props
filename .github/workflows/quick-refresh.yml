name: Quick refresh (lineups + score updates)

# Runs every 15 minutes to catch the things that genuinely change on that
# timescale -- a lineup posting, a game getting postponed/delayed, a final
# score coming in -- without re-running the *hourly* workflow's slow full
# stats backfill (sync_stats.py budgets 30 minutes on its own) more often
# than it can actually finish. That would just cause each run to cancel the
# last one mid-backfill via the concurrency group, forever, and the site
# would never actually update.
#
# Deliberately lean: schedule + lineups + re-simulate + rebuild, nothing
# else. Also deliberately does NOT save the database cache back (see the
# restore step below) -- every write this job makes (schedule rows, lineup
# rows, projection snapshots) is either cheap to re-fetch from the live API
# next time or not worth long-term persistence, so it just reads the cache
# hourly.yml maintains rather than racing hourly.yml to update it.

on:
  schedule:
    # Every 5 minutes, offset 2 past each mark rather than exactly on it --
    # GitHub explicitly documents that scheduled runs are delayed most at
    # round-number times, since that's when the most workflows across all
    # of GitHub Actions are queued at once (confirmed this matters in
    # practice at the old 15-min cadence: the exact :00/:15/:30/:45
    # schedule was actually landing every 2-3.5 hours some days). Tightened
    # from 15 min to 5 min so a newly-confirmed lineup or line move shows
    # up sooner -- this job's own runs consistently finish in 3-6 minutes
    # (checked via `gh run list`) and this is a public repo (unlimited
    # Actions minutes), and cancel-in-progress below already makes an
    # occasional overlap harmless (the slower run just gets cancelled
    # instead of piling up) rather than something this interval needs to
    # avoid outright.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: quick-refresh
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Read-only use of the cache hourly.yml maintains -- no save-back step,
      # so this job can never race hourly.yml's own cache write.
      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: mlb_props.db
          key: mlb-db-v1

      - name: Sync schedule
        run: python pull/sync_schedule.py
        continue-on-error: true

      - name: Sync confirmed lineups
        run: python pull/sync_lineups.py
        continue-on-error: true

      - name: Simulate upcoming games
        run: python pull/simulate_games.py
        continue-on-error: true

      - name: Build props report + dashboard
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python pull/build_props.py --skip-archive

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && exit 0
          git commit -m "Quick refresh"
          # output/ is pure generated data, not hand-edited content -- a
          # rebase conflict here (e.g. racing the hourly job, a separate
          # concurrency group this one doesn't share) just means another
          # job's own regeneration landed first. -X theirs keeps OUR
          # freshly-built commit's content on conflict (confusingly, during
          # a rebase "theirs" means the commit being replayed -- i.e. ours;
          # see git-rebase(1) and hourly.yml's own commit step for the full
          # story on why every retry aborts any stuck rebase first, and why
          # this fails loudly instead of silently deploying a conflicted
          # working tree if it still can't converge after 5 attempts).
          success=false
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            if git pull --rebase -X theirs origin main && git push; then
              success=true
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          git rebase --abort >/dev/null 2>&1 || true
          if [ "$success" != true ]; then
            echo "::error::Could not push output/ after 5 attempts -- deploying this run's own local commit instead of a conflicted working tree."
            exit 1
          fi

      - name: Configure Pages
        if: always()
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload dashboard for Pages
        if: always()
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      # GitHub's own Pages deployment backend occasionally stalls in
      # "deployment_queued" with zero progress (a platform-side backlog,
      # not anything this pipeline controls -- seen in practice eating the
      # action's full internal timeout). continue-on-error means that
      # doesn't get reported as a failed run: the data sync + git commit
      # above already succeeded and is safely pushed by this point, so
      # nothing is lost -- the live site just stays on the previous deploy
      # a little longer and self-heals at the next Quick refresh run 15
      # minutes later. The shorter 2-minute timeout (vs. deploy-pages' own
      # 10-minute default) matters specifically here because this job's
      # own timeout-minutes budget is only 10 total -- no point letting a
      # stalled deploy eat the entire budget for a job meant to be quick
      # and run again in another 15 minutes regardless.
      - name: Deploy to Pages
        if: always()
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
