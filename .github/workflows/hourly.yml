name: Hourly sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: hourly-sync
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # mlb_props.db is NOT committed to git -- it's a large, constantly-mutating
      # binary and git can't delta-compress SQLite pages, so committing it every
      # hour would balloon repo history by the full file size on every run.
      # actions/cache persists it across runs instead; the delete-then-save
      # dance keeps a single entry alive rather than accumulating one per run.
      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: mlb_props.db
          key: mlb-db-v1

      # continue-on-error on every sync step: a bug or transient failure in
      # any ONE source (as literally just happened -- a NameError crashed
      # sync_stats and silently blocked every step after it, including
      # build_props, for who knows how many hourly runs while still
      # reporting a "successful" deploy of stale output) should never be
      # able to block the rest of the pipeline from running with whatever
      # data IS available. build_props itself stays fail-fast -- if THAT
      # breaks, we genuinely have nothing new to deploy and want to know.
      - name: Sync teams & rosters
        run: python pull/sync_teams_and_roster.py
        continue-on-error: true

      - name: Sync schedule
        run: python pull/sync_schedule.py
        continue-on-error: true

      - name: Sync confirmed lineups
        run: python pull/sync_lineups.py
        continue-on-error: true

      - name: Sync stats (game logs + splits)
        run: python pull/sync_stats.py --time-budget-seconds 2400
        continue-on-error: true

      - name: Sync injuries & news
        run: python pull/sync_news.py
        continue-on-error: true

      - name: Sync game results (final scores)
        run: python pull/sync_results.py
        continue-on-error: true

      # Grades yesterday's (and the previous 3 days') picks/signals against
      # actual results and appends to output/track_record.json --
      # idempotent (re-grading an already-graded date just recomputes it),
      # so running this every hour is harmless. The backfill window matters:
      # sync_stats.py is time-budgeted and can genuinely still be catching
      # up on some players' game logs by the time this runs, which used to
      # get permanently recorded as "no data" the moment the date stopped
      # being "yesterday" (grading a bare --date only ever re-touches that
      # one day) -- confirmed on a real pick (a Royals batter with a real
      # HR/RBI game graded "no data" because his box score hadn't synced
      # yet when grading ran that day). Re-grading the last few days every
      # hour lets it self-heal instead of freezing a sync race forever.
      # build_props.py (next step) reads track_record.json to rebuild the
      # Track Record page, so this has to run first.
      - name: Grade recent picks against results
        run: python pull/grade_picks.py --backfill-days 3
        continue-on-error: true

      - name: Simulate upcoming games
        run: python pull/simulate_games.py
        continue-on-error: true

      - name: Build props report + dashboard
        run: python pull/build_props.py

      - name: Verify data integrity
        run: python pull/verify_data.py --limit 300
        continue-on-error: true

      # if: always() would also fire on a CANCELLED run (e.g. a manual
      # cancel to avoid a stale-code race) -- saving whatever partial,
      # barely-populated DB existed at that exact instant and permanently
      # poisoning the cache for every future run (this is exactly what
      # happened once already). !cancelled() still covers both success and
      # failure (so a broken sync step doesn't lose whatever data DID
      # sync), just not an externally-cancelled run. The size check below
      # is a second, independent line of defense against ever saving a
      # corrupted/near-empty DB, explicitly gating the save step itself
      # rather than relying on cache-key-exists behavior to save us.
      - name: Check DB size before saving cache
        id: db_size_check
        if: ${{ !cancelled() }}
        run: |
          size=$(stat -c%s mlb_props.db)
          min_size=5000000
          if [ "$size" -lt "$min_size" ]; then
            echo "::warning::mlb_props.db is only $size bytes (< $min_size) -- refusing to overwrite the cache with what looks like a corrupted/empty database."
            echo "safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete stale cache entry
        if: ${{ !cancelled() && steps.db_size_check.outputs.safe == 'true' }}
        run: gh cache delete mlb-db-v1 --repo "${{ github.repository }}" || true

      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.db_size_check.outputs.safe == 'true' }}
        with:
          path: mlb_props.db
          key: mlb-db-v1

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && exit 0
          git commit -m "Hourly data sync"
          # The job runs long enough that main can move (another push, or an
          # overlapping run) before this push happens -- rebase onto the
          # latest main first, retrying a few times, rather than failing the
          # whole job (and skipping the Pages deploy) on an ordinary race.
          #
          # output/ is pure generated data (JSON/HTML snapshots), not
          # hand-edited content -- a rebase conflict here just means another
          # job's own regeneration landed first, not a real disagreement
          # worth resolving by hand. -X theirs keeps OUR freshly-built
          # commit's content on conflict (confusingly, during a rebase
          # "theirs" means the commit being replayed -- i.e. ours -- while
          # "ours" means the upstream tip; see git-rebase(1)).
          #
          # Every retry aborts any stuck rebase first: a previous version of
          # this script didn't, so a conflict on attempt 1 left every
          # subsequent attempt failing with "unmerged files" instead of
          # actually retrying, silently exhausted all 5 attempts, and then
          # proceeded (the deploy steps below use if: always()) to deploy
          # the still-conflict-marked working tree to Pages as broken
          # JSON/HTML. Now: if it still can't converge after 5 attempts,
          # abort back to this run's own clean local commit (deploy fresh
          # data that's just not yet merged with the other job's, instead
          # of a half-resolved conflict) and fail the step loudly so a
          # persistent problem is actually visible.
          success=false
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            if git pull --rebase -X theirs origin main && git push; then
              success=true
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          git rebase --abort >/dev/null 2>&1 || true
          if [ "$success" != true ]; then
            echo "::error::Could not push output/ after 5 attempts -- deploying this run's own local commit instead of a conflicted working tree."
            exit 1
          fi

      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload dashboard for Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
