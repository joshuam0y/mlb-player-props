name: Log a bet

# Personal bet tracker entry point -- being logged into GitHub with write
# access to this repo IS the "login" (this form is only usable by repo
# collaborators, same as any other workflow_dispatch). See pull/log_bet.py
# for the full design rationale: bets are stored in a single committed
# JSON file (output/user_bets.json), not the disposable SQLite cache, and
# every leg is graded using the exact same pick_result()/game-result logic
# as every other pick on this site.

on:
  workflow_dispatch:
    inputs:
      stake:
        description: "Amount wagered, e.g. 5.00"
        required: true
      to_win:
        description: "Profit if the bet WINS -- not total payout (e.g. a $5 bet that pays $10.45 total has to_win=5.45)"
        required: true
      legs:
        description: "One leg per line: 'Player Name | Category | Line | over/under'. Categories: Hits, Total Bases, Home Runs, RBIs, Runs Scored, Walks, Strikeouts, Outs Recorded, Runs Allowed, Hits Allowed, Walks Allowed"
        required: true
      date:
        description: "Game date, YYYY-MM-DD. Leave blank for today."
        required: false
      odds:
        description: "American odds as shown on the sportsbook, e.g. +115 (optional, display only)"
        required: false
      sportsbook:
        description: "Sportsbook name"
        required: false
        default: "FanDuel"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  log-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: mlb_props.db
          key: mlb-db-v1

      # Values are passed via env vars, not spliced directly into the
      # script with ${{ }} -- that would be a real shell-injection risk
      # (GitHub substitutes ${{ }} as raw text into the script BEFORE bash
      # ever parses it), and --legs can be multi-line for a parlay, which
      # only survives correctly through a quoted "$VAR" expansion anyway.
      - name: Log bet
        env:
          BET_DATE: ${{ inputs.date }}
          BET_STAKE: ${{ inputs.stake }}
          BET_TO_WIN: ${{ inputs.to_win }}
          BET_ODDS: ${{ inputs.odds }}
          BET_LEGS: ${{ inputs.legs }}
          BET_SPORTSBOOK: ${{ inputs.sportsbook }}
        run: |
          ARGS=(--stake "$BET_STAKE" --to-win "$BET_TO_WIN" --legs "$BET_LEGS")
          if [ -n "$BET_DATE" ]; then ARGS+=(--date "$BET_DATE"); fi
          if [ -n "$BET_ODDS" ]; then ARGS+=(--odds "$BET_ODDS"); fi
          if [ -n "$BET_SPORTSBOOK" ]; then ARGS+=(--sportsbook "$BET_SPORTSBOOK"); fi
          python pull/log_bet.py "${ARGS[@]}"

      # Also regrades every pending leg across every previously logged bet
      # (see log_bet.regrade_all(), called from build_props.py's own run())
      # and re-renders My Bets, so this one action both logs the new bet
      # AND catches up anything that finished since the last sync.
      - name: Rebuild dashboard
        run: python pull/build_props.py --skip-archive

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && exit 0
          git commit -m "Log bet via workflow_dispatch"
          # Same race-safe retry pattern as hourly.yml/quick-refresh.yml's
          # own commit step -- see that file for the full incident history
          # on why every retry aborts any stuck rebase first and this
          # fails loudly instead of deploying a conflicted working tree.
          success=false
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1 || true
            if git pull --rebase -X theirs origin main && git push; then
              success=true
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          git rebase --abort >/dev/null 2>&1 || true
          if [ "$success" != true ]; then
            echo "::error::Could not push output/ after 5 attempts -- deploying this run's own local commit instead of a conflicted working tree."
            exit 1
          fi

      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload dashboard for Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
